# FreePlayer — iPad app project (generated by XcodeGen).
# Shares the cross-platform shell sources (Core/Bridge/UI/App.NavGate) with
# the macOS CMake build; iOS-only code lives in Platform/iPad and ios/Sources.
name: FreePlayer
options:
  bundleIdPrefix: com.zprolab
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  FreePlayer:
    type: application
    platform: iOS
    sources:
      - path: ../shell/Sources/UI
      - path: ../shell/Sources/App/NavGate.swift
      - path: ../shell/Sources/Bridge
      - path: ../shell/Sources/Core
      - path: ../shell/Sources/Platform/iPad
      - path: Sources
    preBuildScripts:
      - name: Copy Web Assets
        basedOnDependencyAnalysis: false
        script: |
          rsync -a --delete "$SRCROOT/../dist/" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/web/"
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: FreePlayer
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zprolab.FreePlayer
        TARGETED_DEVICE_FAMILY: "2"
        SWIFT_VERSION: "5.0"
        # CLI simulator builds don't need signing; real-device installs
        # require a team — override in Xcode.
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        ENABLE_HARDENED_RUNTIME: "NO"
        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: "YES"

schemes:
  FreePlayer:
    build:
      targets:
        FreePlayer: all
    run:
      config: Debug
