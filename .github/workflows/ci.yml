name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      # full history + tags: vite.config.js derives __APP_VERSION__ from git
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  build:
    name: Vite build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  shell:
    name: macOS shell compile
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Build shell
        # Point CMake at the Xcode toolchain's swiftc explicitly — the runner's
        # bundled CMake may not auto-detect the Swift compiler.
        run: |
          cmake -S shell -B shell/build \
            -DCMAKE_Swift_COMPILER="$(xcrun -f swiftc)"
          cmake --build shell/build

  ipad:
    name: iPad build (simulator)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install XcodeGen
        run: brew install xcodegen
      # build:ipad = icons (assets/logo.svg) → xcodegen → xcodebuild (simulator).
      # SIM_DEST=generic keeps the runner's Xcode version agnostic (its
      # simulator list lacks the newest iPad models; generic builds fine).
      - name: Build iPad app
        run: pnpm build:ipad
        env:
          SIM_DEST: generic/platform=iOS Simulator
