# FreePlayer — iPad/iPhone app project (generated by XcodeGen).
name: FreePlayer
options:
  bundleIdPrefix: com.zprolab
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  xcodeVersion: "15.0"

targets:
  FreePlayer:
    type: application
    platform: iOS
    sources:
      - path: Sources/UI
      - path: Sources/App/NavGate.swift
      - path: Sources/Bridge
      - path: Sources/Core
      - path: Sources/Platform/iPad
      - path: Assets.xcassets
    preBuildScripts:
      - name: Copy Web Assets
        basedOnDependencyAnalysis: false
        script: |
          rsync -a --delete "$SRCROOT/../dist/" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/web/"
    info:
      path: Info-iOS.plist
      properties:
        CFBundleDisplayName: FreePlayer
        CFBundleShortVersionString: ${FP_BUILD_VERSION}
        CFBundleVersion: ${FP_BUILD_VERSION}
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zprolab.FreePlayer
        TARGETED_DEVICE_FAMILY: "2"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development
        ENABLE_HARDENED_RUNTIME: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: "YES"
      configs:
        # Testability injects -enable-testing: fine for Debug, never ship it.
        Debug:
          ENABLE_TESTABILITY: "YES"
        Release:
          ENABLE_TESTABILITY: "NO"

  FreePlayer-iPhone:
    type: application
    platform: iOS
    sources:
      - path: Sources/UI
      - path: Sources/App/NavGate.swift
      - path: Sources/Bridge
      - path: Sources/Core
      - path: Sources/Platform/iPad
        excludes:
          - FreePlayeriOSApp.swift
      - path: Sources/Platform/iPhone
      - path: Assets.xcassets
    preBuildScripts:
      - name: Copy Web Assets
        basedOnDependencyAnalysis: false
        script: |
          rsync -a --delete "$SRCROOT/../dist/" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/web/"
    info:
      path: Info-iPhone.plist
      properties:
        CFBundleDisplayName: FreePlayer
        CFBundleShortVersionString: ${FP_BUILD_VERSION}
        CFBundleVersion: ${FP_BUILD_VERSION}
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zprolab.FreePlayer.iPhone
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development
        ENABLE_HARDENED_RUNTIME: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: "YES"
      configs:
        Debug:
          ENABLE_TESTABILITY: "YES"
        Release:
          ENABLE_TESTABILITY: "NO"

  # ── Unit tests (XCTest) ──
  FreePlayerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/UnitTests
    dependencies:
      - target: FreePlayer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zprolab.FreePlayer.Tests
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/FreePlayer.app/FreePlayer"
        BUNDLE_LOADER: "$(TEST_HOST)"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @loader_path/Frameworks"

  # ── UI tests (XCUITest) ──
  FreePlayerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/UITests
    dependencies:
      - target: FreePlayer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zprolab.FreePlayer.UITests
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_TARGET_NAME: "FreePlayer"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @loader_path/Frameworks"
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SDKROOT)/Developer/Library/Frameworks"

schemes:
  FreePlayer:
    build:
      targets:
        FreePlayer: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FreePlayerTests
        - FreePlayerUITests

  FreePlayer-iPhone:
    build:
      targets:
        FreePlayer-iPhone: all
    run:
      config: Debug

  FreePlayerTests:
    build:
      targets:
        FreePlayerTests: all
    test:
      config: Debug
      targets:
        - FreePlayerTests

  FreePlayerUITests:
    build:
      targets:
        FreePlayerUITests: all
    test:
      config: Debug
      targets:
        - FreePlayerUITests
