# FreePlayer — iPad app project (generated by XcodeGen).
# All Swift sources live in Sources/ (one tree shared with the macOS CMake
# build): cross-platform Core/Bridge/UI + the iOS platform layer
# Platform/iPad (app entry, WKWebView container, platform bridge).
name: FreePlayer
options:
  bundleIdPrefix: com.zprolab
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  # CI runners ship Xcode 26+ (macos-26) which reads the generated format-77
  # project; xcodeVersion pins LastUpgradeCheck metadata.
  xcodeVersion: "15.0"

targets:
  FreePlayer:
    type: application
    platform: iOS
    sources:
      - path: Sources/UI
      - path: Sources/App/NavGate.swift
      - path: Sources/Bridge
      - path: Sources/Core
      - path: Sources/Platform/iPad
      - path: Assets.xcassets
    preBuildScripts:
      - name: Copy Web Assets
        basedOnDependencyAnalysis: false
        script: |
          rsync -a --delete "$SRCROOT/../dist/" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/web/"
    info:
      path: Info-iOS.plist
      properties:
        CFBundleDisplayName: FreePlayer
        # Version injected at build time: build-ipad.sh sets FP_BUILD_VERSION
        # to <pkg.version> on tag builds or <pkg.version>-<git-short-hash>
        # otherwise. XcodeGen interpolates the env var here.
        CFBundleShortVersionString: ${FP_BUILD_VERSION}
        CFBundleVersion: ${FP_BUILD_VERSION}
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zprolab.FreePlayer
        TARGETED_DEVICE_FAMILY: "2"
        SWIFT_VERSION: "5.0"
        # Personal team (free) signing — DEVELOPMENT_TEAM is NOT hardcoded here;
        # pass it on the command line (or set it in Xcode's Signing & Capabilities):
        #   xcodebuild ... DEVELOPMENT_TEAM=<TeamID> CODE_SIGN_STYLE=Automatic
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development
        ENABLE_HARDENED_RUNTIME: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: "YES"

schemes:
  FreePlayer:
    build:
      targets:
        FreePlayer: all
    run:
      config: Debug
